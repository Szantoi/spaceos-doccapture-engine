name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A semlegessegi kapu ELOL fut: ha markanev vagy iparagi szo kerult a
      # csomagba, azt olcsobb itt megtudni, mint a fogyasztonal. A csomag akkor
      # eladhato, ha barmely iparagban hasznalhato.
      - name: Semlegessegi kapu
        run: python tools/neutrality_guard.py

      # A PUBLIKALT szerzodes hash-pinje. Ha a sema valtozik es a pin nem, ez
      # elbukik -- a verzio-emeles KIMONDOTT lepes, nem mellekhatas. A kapu azt is
      # ellenorzi, hogy a HAROM helyen allo verzio (sema $id, pin, szerializalo)
      # ugyanazt mondja: harom igazsag ugyanarrol elobb-utobb elcsuszna.
      - name: Kontraktus hash-pin
        run: python tools/contract_pin.py

      # A G5 (MIT licenc, Gabor 2026-07-30) fuggoseg-oldali kapuja. A DC-01
      # felderitese kimerte, hogy ezt addig SEMMI nem orizte: az elso GPL-es
      # fuggoseggel a szabaly mereses nelkulive valt volna, es a suite ZOLD marad.
      #
      # A kapu KET kulon kerdest mer: (1) megfelelo-e, ami TELEPITVE van, es
      # (2) szabad-e ra HIVATKOZNI (a pyproject alsó verzio-korlatja). A ketto nem
      # ugyanaz -- a surya-ocr 0.20.0 ELOTT GPL, attol Apache-2.0, tehat a licenc a
      # VERZIO tulajdonsaga.
      - name: Licenc-kapu (G5, negativ + pozitiv kontrollal)
        run: python tools/license_guard.py

      # ------------------------------------------------------------------
      # 1. kor: FUGGOSEG NELKUL
      #
      # A README es a pyproject azt allitja, hogy a mag es az elvalasztott
      # szoveges ut kulso csomag nelkul mukodik. Ez a kor MEGMERI: eloszor
      # bizonyitjuk, hogy a tablazat-olvaso valoban NINCS telepitve (kulonben a
      # meres semmit nem allit), aztan lefuttatjuk azt a reszt, aminek mennie kell.
      # ------------------------------------------------------------------
      - name: Fuggoseg-mentesseg merese (negativ kontrollal)
        run: python tools/measure_dependency_free.py

      # ------------------------------------------------------------------
      # 2. es 3. kor: az EXTRAT igenylo utak
      #
      # Mindket kor sajat POZITIV kontrollal indul: kimondva ellenorzi, hogy a
      # fuggosege megvan. Enelkul egy elszallt telepites utan a `skipUnless`-szel
      # vedett tesztek CSENDBEN kimaradnanak, es a suite ZOLD lenne — uresen zold
      # szamlalo. A kontrollt maga a mero eszkoz vegzi (`--round`), tehat nem
      # csuszhat el a listatol, amit futtat.
      # ------------------------------------------------------------------
      - name: A tablazatos es a dokumentum-extra telepitese
        run: python -m pip install --disable-pip-version-check ".[tabular,document]"

      - name: 2. kor — munkafuzet-ut (pozitiv kontrollal)
        run: python tools/measure_dependency_free.py --round workbook

      - name: 3. kor — szovegreteges ut (pozitiv kontrollal)
        run: python tools/measure_dependency_free.py --round document

      - name: Teljes suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      # ------------------------------------------------------------------
      # 3. kor: a KAPUK meg is fognak-e
      #
      # Egy zold suite azt mondja, hogy a kod atmegy a tesztjein. Azt NEM, hogy
      # a tesztek fognak-e barmin. A mutacios ellenorzo minden kapunal
      # bizonyitja, hogy szandekos elrontasra pirosra valt -- es kimondja, ha
      # egy meresi pont ELMOZDULT (ERVENYTELEN), nem hallgatja el.
      # ------------------------------------------------------------------
      - name: Mutacios kapu-meres
        run: python tools/mutation_check.py

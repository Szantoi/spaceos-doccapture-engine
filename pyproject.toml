[project]
name = "doccapture-engine"
version = "0.2.0"
description = "Iparag-agnosztikus dokumentum-befogado motor"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

# A MAG fuggoseg-mentes, es ez nem veletlen: az elvalasztott szoveges ut (a
# cegek integralasanak leggyakoribb bemenete) kulso csomag nelkul mukodik.
# Aki csak azt hasznalja, ne fizesse meg egy tablazat-olvaso telepitesi
# kockazatat -- ez piaci elony, ne dobjuk el egy import kedveert.
dependencies = []

[project.optional-dependencies]
# A munkafuzet-olvasas kulso csomagot igenyel, es ezt KIMONDVA kerjuk: a hiany
# ertelmes hibauzenetet ad, nem import-hibat a semmibol.
tabular = ["openpyxl>=3.1"]
# A digitalis PDF szovegreteg-olvasasa. A nev NEM 'pdf': formatum-nev nem kerul
# a publikus feluletre. A felso korlat NEM izles: minden meresunk a 4.30.0 /
# libpdfium 6462 parosonkeszult, es az 5.x licenc-mezoje MAS ALAKU (masodkezbol
# mert) -- korlat nelkul a CI olyan verziot telepitene, amin egyetlen meresunk
# sem all. Emeles csak ujra-meressel (ld. tools/licenses.json _measured_notes).
document = ["pypdfium2>=4.30,<5"]

[tool.setuptools.packages.find]
where = ["src"]
